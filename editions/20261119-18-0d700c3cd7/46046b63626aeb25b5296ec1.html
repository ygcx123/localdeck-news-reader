<div class="byline">IT之家　·　发布时间 <time>2026-11-19T09:01:42+00:00</time></div><p class="lead">为应对AI智能眼镜作弊问题，韩国安防企业K&amp;Us与Gison正竞相研发无线电探测设备。K&amp;Us计划明年年初完成原型机，可分析蓝牙和Wi-Fi信号并报警；Gison则开发AR可视化软件及低价固定式设备，预计明年上半年推出。韩国广播通信电波振兴院（KCA）亦委托开发同类设备，两家公司参与竞标。</p><figure><a href="46046b63626aeb25b5296ec1.jpg"><img src="46046b63626aeb25b5296ec1.jpg" alt="原报道配图"></a><figcaption>配图来源：IT之家</figcaption></figure>
