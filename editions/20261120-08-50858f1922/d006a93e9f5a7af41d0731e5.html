<div class="byline">中国新闻网即时　·　发布时间 <time>2026-11-19T09:15:34+00:00</time></div><p class="lead">据新华社报道，11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤，就大国如何正确相处、共同为世界和平托底提出4点看法：坚持相互尊重、坚持和平共处、坚持合作共赢、坚持对话协商。习近平表示，中俄美要做伙伴、做朋友，不冲突、不对抗，守住和平共处底线，努力跨越“修昔底德陷阱”。</p>
