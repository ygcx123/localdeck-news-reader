<div class="byline">中国新闻网即时　·　发布时间 <time>2026-11-22T02:22:09+00:00</time></div><p class="lead">87版《红楼梦》经典角色被AI技术魔改用于低俗宅斗短剧，引发肖像权争议并登上热搜。该事件揭示AI二创乱象，部分创作者借‘致敬经典’之名行侵权牟利之实，平台审核机制滞后。文章呼吁创作者守法守界，平台强化审核，以技术赋能正向创新，守护经典艺术。</p>
