<div class="byline">IT之家　·　发布时间 <time>2026-11-22T03:21:10+00:00</time></div><p class="lead">韩国教育部长崔教振因2027年高考AI作弊防范措施不足引发混乱而辞职。事件中，教育部查处111名违规携带智能设备考生，包括5起实际作弊案例，如使用AI眼镜或手机拍摄考卷。教育部称将12月11日前完成处置，此前已通过短信与WiFi探测等方式查获违规行为。</p><figure><a href="b77b03754c716b306bf30c5d.jpg"><img src="b77b03754c716b306bf30c5d.jpg" alt="原报道配图"></a><figcaption>配图来源：IT之家</figcaption></figure>
