<div class="byline">IT之家　·　发布时间 <time>2026-11-23T02:44:11+00:00</time></div><p class="lead">谷歌因AI搜索变现能力下降，其搜索广告收入增速从17%放缓至12%，股价下跌18%；苹果服务业务收入同比增长率从12%降至10%，预计下一季度增长将更弱。此变化源于用户转向AI工具搜索，削弱谷歌传统搜索广告收益，同时影响苹果依赖谷歌的搜索分成收入。</p>
