<div class="byline">IT之家　·　发布时间 <time>2026-11-23T02:23:14+00:00</time></div><p class="lead">特斯拉CEO马斯克11月22日称，因全球DRAM内存和NAND闪存价格飙升，特斯拉AI4车载电脑物料成本已翻倍。他未透露具体成本数值或一年前成本。同时回应AI5芯片将用于Optimus机器人，汽车仍用AI4。</p><figure><a href="76c172a42daa646800340273.jpg"><img src="76c172a42daa646800340273.jpg" alt="原报道配图"></a><figcaption>配图来源：IT之家</figcaption></figure>
