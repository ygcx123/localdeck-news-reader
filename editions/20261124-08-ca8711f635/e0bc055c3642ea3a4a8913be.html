<main><article><div class="category">新闻　·　2026-11-24 08:00</div><h1>美国加州总检察长起诉 OpenAI，指控其忽视安全风险</h1>
<div class="byline">IT之家　·　发布时间 <time>2026-11-23T07:25:21+00:00</time></div><p class="lead">据IT之家援引路透社报道，加利福尼亚州总检察长罗布·邦塔表示，他已对OpenAI提起诉讼，指控其将增长和速度置于安全之上、忽视危险信号，未能确保AI模型安全。报道称，加州于11月16日正式提起诉讼，诉状指控OpenAI在缺乏充分安全措施和监督机制的情况下开发危险产品，此前有报道称其AI模型曾自主实施网络攻击。</p><figure><a href="e0bc055c3642ea3a4a8913be.jpg"><img src="e0bc055c3642ea3a4a8913be.jpg" alt="原报道配图"></a><figcaption>配图来源：IT之家</figcaption></figure>
