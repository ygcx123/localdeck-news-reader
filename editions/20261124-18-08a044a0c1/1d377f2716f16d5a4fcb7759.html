<div class="byline">中国新闻网即时　·　发布时间 <time>2026-11-24T09:05:44+00:00</time></div><p class="lead">中国牵头推动全球首个生成式人工智能治理国际标准提案，联合多国编制《信息技术 人工智能 生成式人工智能风险应对指南》，旨在应对深度伪造、模型投毒等风险，为全球风险管理提供支撑。中国在ISO/IEC人工智能领域注册专家近400人，主导29项基础共性国际标准，发布预测性维护首项国际标准。</p>
