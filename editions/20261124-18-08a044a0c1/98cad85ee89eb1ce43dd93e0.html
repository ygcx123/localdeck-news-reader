<div class="byline">IT之家　·　发布时间 <time>2026-11-24T07:39:37+00:00</time></div><p class="lead">联合国秘书长古特雷斯在巴巴多斯主办的AI安全峰会上呼吁建立多边AI风险管理框架，以防止技术加剧全球不平等。他强调各国应对AI风险能力悬殊，需通过共识、统一术语和本地检测能力提升协作，并呼吁全球南方国家获得能力建设支持。峰会由250多名代表参与，形成倡议推动多方投入。</p><figure><a href="98cad85ee89eb1ce43dd93e0.jpg"><img src="98cad85ee89eb1ce43dd93e0.jpg" alt="原报道配图"></a><figcaption>配图来源：IT之家</figcaption></figure>
