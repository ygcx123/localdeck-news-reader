<div class="byline">IT之家　·　发布时间 <time>2026-11-25T02:32:15+00:00</time></div><p class="lead">开源办公套件 LibreOffice 开发者若使用AI大模型写代码，须先申请并获工程指导委员会批准，提交时需逐行解释代码逻辑，且禁止AI生成提交说明、注释、缺陷报告及沟通内容。政策旨在强化人工代码责任，非全面禁用AI，仅限于特定代码区域禁用。</p><figure><a href="fd257bd49f9c00b3ee0ad40f.jpg"><img src="fd257bd49f9c00b3ee0ad40f.jpg" alt="原报道配图"></a><figcaption>配图来源：IT之家</figcaption></figure>
