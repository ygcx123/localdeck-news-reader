<div class="byline">IT之家　·　发布时间 <time>2026-11-25T07:30:51+00:00</time></div><p class="lead">小米CFO林世伟在财报电话会上称，公司今年将在AI领域投入160亿元，该投入正稳健落地。AI相关收入持续增长，MiMo大模型API调用量上升，AI业务处于大规模投入期，已应用于小米18 Fold手机及澎湃OS 4的“超级小爱2.0”系统。</p>
