<div class="byline">IT之家　·　发布时间 <time>2026-11-26T01:30:31+00:00</time></div><p class="lead">育碧被曝要求游戏开发者使用生成式AI以缩短开发周期，若不使用需向公司说明理由。该政策引发部分员工不满，管理层态度转变令开发者感到压力。此前育碧已进行多轮裁员并取消部分项目，AI在游戏开发中仍存争议，如《光与影：33号远征队》曾因AI素材遭玩家反对。</p><figure><a href="152f523926f9188203ca7ec7.jpg"><img src="152f523926f9188203ca7ec7.jpg" alt="原报道配图"></a><figcaption>配图来源：IT之家</figcaption></figure>
