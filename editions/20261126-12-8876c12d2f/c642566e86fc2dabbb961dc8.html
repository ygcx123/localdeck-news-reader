<div class="byline">IT之家　·　发布时间 <time>2026-11-26T00:22:26+00:00</time></div><p class="lead">三部委联合印发《新一代通信网建设实施方案》，明确到2030年建成性能领先的新一代通信网，适时开展6G网络建设。方案以5G-A/6G、万兆光网、卫星互联网为核心，强调天地一体、云网融合，推动AI应用、算力架构升级及终端普及，目标覆盖6万家企业网络改造。</p><figure><a href="c642566e86fc2dabbb961dc8.jpg"><img src="c642566e86fc2dabbb961dc8.jpg" alt="原报道配图"></a><figcaption>配图来源：IT之家</figcaption></figure>
