<div class="byline">IT之家　·　发布时间 <time>2026-11-26T07:56:41+00:00</time></div><p class="lead">德国勃兰登堡消费者保护中心起诉OpenAI，指控其ChatGPT订阅服务取消流程繁琐且缺乏透明度，违反德国法律。该中心指出，开通订阅简单，但取消需通过原开通平台（如网页端），手机App无法操作，且合同中‘可单方面调整价格’条款未说明合理依据，如未限定仅在运营成本上涨时调价。</p><figure><a href="fec0911afc080d7ab86d37d7.jpg"><img src="fec0911afc080d7ab86d37d7.jpg" alt="原报道配图"></a><figcaption>配图来源：IT之家</figcaption></figure>
