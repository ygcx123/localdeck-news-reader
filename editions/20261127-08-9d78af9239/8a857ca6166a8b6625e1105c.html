<div class="byline">中国新闻网　·　发布时间 <time>2026-11-26T09:31:54+08:00</time></div><p class="lead">模特七海指控AI短剧平台未经许可，通过AI融脸技术抓取其面部特征生成相似面孔用于剧集与广告，导致其肖像被持续商用。该技术不直接复刻原貌，而是混合多组特征，使侵权取证与界定困难。七海称此类‘赛博七海’会无限再生，其肖像数据若仍在模型中，将无法彻底控制自身形象。</p>
