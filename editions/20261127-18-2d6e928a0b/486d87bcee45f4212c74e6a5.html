<div class="byline">IT之家　·　发布时间 <time>2026-11-27T08:02:36+00:00</time></div><p class="lead">据IT之家报道，中国连锁经营协会联合德勤中国11月25日发布白皮书称，近八成受访者所在企业已开展AI智能体应用，其中23%已规模化使用、56%处于小范围试点；47%的受访者将“担心项目无法带来足够收益”列为AI应用的主要障碍，成为最受关注的问题。</p><figure><a href="486d87bcee45f4212c74e6a5.jpg"><img src="486d87bcee45f4212c74e6a5.jpg" alt="原报道配图"></a><figcaption>配图来源：IT之家</figcaption></figure>
