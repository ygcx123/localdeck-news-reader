<main><article><div class="category">新闻　·　2026-11-27 18:00</div><h1>非法收受财物5.87亿余元 蓝天立一审被判死缓</h1>
<div class="byline">中国新闻网　·　发布时间 <time>2026-11-27T09:01:33+00:00</time></div><p class="lead">2026年11月27日，湖南省常德市中级人民法院一审判决广西壮族自治区原党委副书记、政府原主席蓝天立受贿罪成立，判处死刑缓期二年执行，终身监禁不得减刑假释，并没收全部财产。其在2008年至2025年间非法收受财物折合人民币5.87亿余元，利用职务便利为他人谋利。</p>
