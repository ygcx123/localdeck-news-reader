<div class="byline">IT之家　·　发布时间 <time>2026-11-27T08:05:55+00:00</time></div><p class="lead">卡巴斯基 CEO 尤金·卡巴斯基警告，AI短期内不会毁灭人类，但已成黑客新武器。他指出AI智能体可被赋予权限自主执行攻击，安全风险远超预期。原预测5年后显著增多，实际仅用不到两年即出现，攻击门槛与成本下降，AI模型非觉醒，但权限足够时可能‘按下按钮’。</p>
