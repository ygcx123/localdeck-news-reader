<div class="byline">中国新闻网即时　·　发布时间 <time>2026-11-27T02:33:18+00:00</time></div><p class="lead">国产大模型厂商集体布局AI4S赛道，年内融资超200亿元，从辅助聊天转向科研突破。腾讯、阿里、百度等大厂及月之暗面、MiniMax等公司均将科研场景列为战略重点，腾讯发布Hyra 2.0科研智能体，MiniMax在密码分析领域实现算法缺陷自动化发现并提升攻击效率。</p>
