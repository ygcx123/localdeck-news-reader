<main><article><div class="category">新闻　·　2026-11-28 12:00</div><h1>魏建军回应“长城汽车销量从第一掉到第九”：内卷、资本裹挟、财务造假是主因</h1>
<div class="byline">IT之家　·　发布时间 <time>2026-11-28T02:29:57+00:00</time></div><p class="lead">据IT之家报道，长城汽车董事长魏建军在广州车展回应销量排名从自主品牌第一下滑至第九，将主因归结为“内卷”“资本裹挟”和“财务造假”，并表示“我排到第九，但是我心里边很坦然”。他称长城不追求走量而追求单车价值，平均单车售价约18万元；2025年前10个月长城累计销量104.1万辆。</p><figure><a href="e005e5bb25f6b90916d249b7.jpg"><img src="e005e5bb25f6b90916d249b7.jpg" alt="原报道配图"></a><figcaption>配图来源：IT之家</figcaption></figure>
